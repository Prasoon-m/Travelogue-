version: '3.8'

services:
  travelogue:
    image: ghcr.io/quana-ai/travelogue:latest
    container_name: travelogue
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FRONTEND_ORIGINS=*
      - OCR_MIN_CONFIDENCE=35
    volumes:
      - travelogue_db:/app/prisma
      - travelogue_uploads:/app/uploads
    networks:
      - web

volumes:
  travelogue_db:
    name: travelogue_db
  travelogue_uploads:
    name: travelogue_uploads

networks:
  web:
    external: true
